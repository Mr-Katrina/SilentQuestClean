[/Script/Engine.GameUserSettings]
; ============================
;  CUSTOM GRAPHICS SETTINGS
; ============================

; --- Resolution / VR Screen Percentage ---
r.ScreenPercentage=100

; --- Quality Overrides ---
; 0 = Low
; 1 = Medium
; 2 = High
; 3 = Epic
; 4 = Cinematic

; Shadows = Epic
sg.ShadowQuality=3

; Post Processing = High
sg.PostProcessQuality=2

; Everything else = Low
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0

; Force UE to use our custom mix instead of a preset
GraphicsQuality=-1

; --- Misc Rendering Behaviors ---
bUseVSync=False
bUseDynamicResolution=False
bUseHDRDisplayOutput=False
bUseDesiredScreenHeight=False

; Optional window defaults (safe for VR builds)
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
FullscreenMode=2     ; 0=Fullscreen, 1=Borderless, 2=Windowed
PreferredFullscreenMode=1
